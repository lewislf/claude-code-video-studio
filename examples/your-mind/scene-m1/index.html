<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0a24; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0a24; }
  #shake, #world { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #illus { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  #fx { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .full { position: absolute; inset: 0; pointer-events: none; }
  #red { background: #ff1f5a; mix-blend-mode: multiply; opacity: 0; }
  #flash { background: #ff3a6e; mix-blend-mode: screen; opacity: 0; }
  #vignette { background: radial-gradient(ellipse at center, rgba(255,31,90,0) 35%, rgba(255,31,90,.85) 100%); opacity: 0; }
  #glow { background: radial-gradient(circle at 54% 60%, rgba(59,224,255,.28), rgba(59,224,255,0) 45%); opacity: 0; }
  #label { position: absolute; left: 72px; top: 60px; font: 500 28px "IBM Plex Mono", monospace; letter-spacing: .18em;
           color: #3be0ff; border: 2px solid #3be0ff; padding: 10px 18px; background: rgba(11,10,36,.75); opacity: 0; }
  #black, #black2 { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="13.6" data-width="1920" data-height="1080">
  <div id="shake">
    <div id="world">
      <img id="illus" src="assets/illustration.png" alt="" />
      <svg id="fx" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <g id="particles"></g>
        <circle id="ring1" cx="1030" cy="636" r="40" fill="none" stroke="#ff4f7d" stroke-width="8" opacity="0"/>
        <circle id="ring2" cx="1030" cy="636" r="40" fill="none" stroke="#ff4f7d" stroke-width="6" opacity="0"/>
        <circle id="ring3" cx="1030" cy="636" r="40" fill="none" stroke="#ffd23e" stroke-width="4" opacity="0"/>
        <g id="sparks" stroke="#ffd23e" stroke-width="7" stroke-linecap="round" opacity="0">
          <path d="M1030 560 L1030 520"/><path d="M1075 572 L1100 540"/><path d="M985 572 L960 540"/><path d="M1100 620 L1140 612"/>
        </g>
        <g id="exclaim" opacity="0"><circle cx="1010" cy="505" r="30" fill="#ffd23e"/><rect x="1005" y="485" width="10" height="24" rx="4" fill="#1a0f3a"/><circle cx="1010" cy="520" r="5" fill="#1a0f3a"/></g>
      </svg>
    </div>
    <div id="glow" class="full"></div>
    <div id="red" class="full"></div>
    <div id="flash" class="full"></div>
    <div id="vignette" class="full"></div>
  </div>
  <div id="label">MIT · UNITED STATES · 2013</div>
  <div id="black"></div><div id="black2" style="opacity:0"></div>
  <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="13.6" data-track-index="1" data-volume="1"></audio>
  <audio id="music" src="assets/music.mp3" data-start="0" data-duration="13.6" data-track-index="2" data-volume="0.16" data-fade-in="1" data-fade-out="1"></audio>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  (function () {
    let s = 7;
    const r = () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const g = document.getElementById("particles"), colors = ["#3be0ff", "#8d7bff", "#ff9bd0", "#ffd23e"];
    for (let i = 0; i < 36; i++) {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("id", "p" + i); c.setAttribute("cx", Math.round(r() * 1920)); c.setAttribute("cy", Math.round(200 + r() * 880));
      c.setAttribute("r", (2 + r() * 4).toFixed(1)); c.setAttribute("fill", colors[i % 4]); c.setAttribute("opacity", (0.25 + r() * 0.5).toFixed(2));
      g.appendChild(c); tl.fromTo("#p" + i, { y: 0 }, { y: -(120 + r() * 260), duration: 13.6, ease: "none" }, 0);
    }
  })();
  const T = 10.95;
  tl.fromTo("#black", { opacity: 1 }, { opacity: 0, duration: 1.0, ease: "power1.out" }, 0);
  tl.fromTo("#label", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.7);
  // camera: slow push-in on the face, then a zoom "punch" on the scare
  tl.fromTo("#world", { scale: 1, x: 0, transformOrigin: "1030px 640px" }, { scale: 1.45, x: -30, transformOrigin: "1030px 640px", duration: T, ease: "sine.inOut" }, 0);
  tl.fromTo("#world", { scale: 1.45 }, { scale: 1.95, duration: 0.22, ease: "power4.out", immediateRender: false }, T);
  tl.fromTo("#world", { scale: 1.95 }, { scale: 2.1, duration: 2.4, ease: "none", immediateRender: false }, T + 0.22);
  tl.fromTo("#glow", { opacity: 0 }, { opacity: 1, duration: 1.4, repeat: 5, yoyo: true, ease: "sine.inOut" }, 1.0);
  tl.fromTo("#glow", { opacity: 1 }, { opacity: 0, duration: 0.1, immediateRender: false }, T);
  // scare: effects on top, the illustration itself does not change
  tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.6, duration: 0.08, ease: "power4.out" }, T);
  tl.fromTo("#flash", { opacity: 0.6 }, { opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, T + 0.08);
  tl.fromTo("#shake", { x: -14 }, { x: 14, duration: 0.04, repeat: 9, yoyo: true, ease: "none" }, T);
  tl.fromTo("#shake", { x: 14 }, { x: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, T + 0.4);
  tl.fromTo("#red", { opacity: 0 }, { opacity: 0.5, duration: 0.25 }, T);
  tl.fromTo("#vignette", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T);
  tl.fromTo("#exclaim", { opacity: 0, scale: 0.2, transformOrigin: "1010px 530px" }, { opacity: 1, scale: 1, transformOrigin: "1010px 530px", duration: 0.2, ease: "back.out(3)" }, T + 0.05);
  tl.fromTo("#sparks", { opacity: 0, scale: 0.4, transformOrigin: "1030px 600px" }, { opacity: 1, scale: 1, transformOrigin: "1030px 600px", duration: 0.18, ease: "back.out(3)" }, T);
  tl.fromTo("#sparks", { opacity: 1 }, { opacity: 0, duration: 0.5, immediateRender: false }, T + 0.8);
  ["#ring1", "#ring2", "#ring3"].forEach((id, i) => tl.fromTo(id, { scale: 0.4, opacity: 0.95, transformOrigin: "1030px 636px" }, { scale: 6, opacity: 0, transformOrigin: "1030px 636px", duration: 1.3, ease: "power2.out", immediateRender: false }, T + i * 0.22));
  tl.fromTo("#label", { color: "#3be0ff", borderColor: "#3be0ff" }, { color: "#ff4f7d", borderColor: "#ff4f7d", duration: 0.2 }, T);
  tl.fromTo("#black2", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.in" }, 13.05);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
